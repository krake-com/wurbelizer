site_name: Wurbelizer
site_description: >-
  The Wurbelizer — a lightweight Java code generator that uses Java as its
  template language and weaves generated code into guarded blocks of your
  source files.
site_url: https://wurbelizer.org/
repo_url: https://bitbucket.org/krake-oss/wurbelizer
repo_name: krake-oss/wurbelizer

# The docs/ tree is generated by prepare.py from ../docs and the repo README.
# Do not edit docs/ by hand — edit the sources under ../docs instead.
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/logo-wurbelizer.png
  favicon: assets/favicon.ico
  font:
    # Roboto matches wurbelizer.org. The privacy plugin localizes these fonts
    # at build time, so there are no requests to Google at runtime (GDPR).
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/bitbucket
  features:
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Code Levels: code-levels.md
  - Build Tool Integration:
      - Overview: integration.md
      - Maven: maven.md
      - Ant: ant.md
      - Console: console.md
  - Wurblet Level Syntax: wurblet-syntax.md
  - Source Level Syntax: source-syntax.md
  - Guard Types: guard-types.md
  - Writing Wurblets: writing-wurblets.md
  - Legal Notice:
      - Impressum / Imprint: impressum.md
      - Datenschutz / Privacy: datenschutz.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search
  # Localizes external assets (e.g. the Roboto web font) at build time so the
  # served site makes no third-party requests. Community edition, >= 9.5.
  - privacy

extra_css:
  - stylesheets/extra.css

extra:
  consent:
    title: Cookies & Datenschutz / Cookies & privacy
    description: >-
      <strong>Deutsch:</strong> Diese Website wird aus Deutschland betrieben und
      ist DSGVO-konform. Sie setzt <em>keine</em> Tracking-Cookies und sendet keine
      Daten an Dritte. Schriftarten und alle Inhalte werden lokal ausgeliefert.
      Lediglich der lokale Speicher Ihres Browsers (<em>localStorage</em>) wird für
      Ihre Designauswahl (hell/dunkel) und für das Speichern dieser Einwilligung
      genutzt.
      <br><br>
      <strong>English:</strong> This website is operated from Germany and is
      GDPR-compliant. It sets <em>no</em> tracking cookies and sends no data to
      third parties. Fonts and all content are served locally. Only your browser's
      <em>localStorage</em> is used — to remember your colour-scheme choice
      (light/dark) and to store this consent.
    actions:
      - accept
      - reject
  social:
    - icon: fontawesome/brands/bitbucket
      link: https://bitbucket.org/krake-oss/wurbelizer
      name: Wurbelizer on Bitbucket
    - icon: material/web
      link: https://wurbelizer.org
      name: wurbelizer.org
  generator: false

copyright: >-
  Licensed under LGPL-2.1 ·
  <a href="impressum/">Impressum</a> ·
  <a href="datenschutz/">Datenschutz / Privacy</a> ·
  <a href="#__consent">Cookie-Einstellungen / Cookie settings</a>
